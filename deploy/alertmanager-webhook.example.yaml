# Fragment for Alertmanager, not a complete config. Send this to the Service,
# never to a public URL. If WEBHOOK_TOKEN is set, bearer_token must match it.
#
# Upstream Alertmanager (alertmanager.yml):
#
# route:
#   receiver: alert-processor
#   group_by: [alertname, namespace]
#   group_wait: 30s
#   group_interval: 5m
#   repeat_interval: 4h
# receivers:
#   - name: alert-processor
#     webhook_configs:
#       - url: http://alert-processor.alert-processor.svc.cluster.local:8080/api/v1/webhook
#         send_resolved: true
#         http_config:
#           authorization:
#             type: Bearer
#             credentials: "<WEBHOOK_TOKEN>"
#
# OpenShift: an AlertmanagerConfig in the alert-processor namespace.
apiVersion: monitoring.coreos.com/v1beta1
kind: AlertmanagerConfig
metadata:
  name: alert-processor
  namespace: alert-processor
spec:
  receivers:
    - name: alert-processor
      webhookConfigs:
        - sendResolved: true
          url: http://alert-processor.alert-processor.svc.cluster.local:8080/api/v1/webhook
          httpConfig:
            authorization:
              type: Bearer
              credentials:
                name: alert-processor
                key: WEBHOOK_TOKEN
  route:
    receiver: alert-processor
    groupBy: [alertname, namespace]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
