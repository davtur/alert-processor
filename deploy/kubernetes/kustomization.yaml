apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: alert-processor
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: alert-processor-models
    files:
      - models.yaml=models.example.yaml
