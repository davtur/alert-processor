apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-processor
  namespace: alert-processor
  labels:
    app.kubernetes.io/name: alert-processor
spec:
  # SQLite on the emptyDir below is safe at one replica. Set DATABASE_URL and
  # raise this only after PostgreSQL is in place.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: alert-processor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alert-processor
    spec:
      serviceAccountName: alert-processor
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-processor
          image: alert-processor:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: MODELS_FILE
              value: /etc/alert-processor/models.yaml
          envFrom:
            - configMapRef:
                name: alert-processor
            - secretRef:
                name: alert-processor
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 36
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: models
              mountPath: /etc/alert-processor
              readOnly: true
      volumes:
        - name: data
          emptyDir: {}
        - name: models
          configMap:
            name: alert-processor-models
