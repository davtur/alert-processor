[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alert-processor"
version = "1.0.0"
description = "Human-approved remediation for Alertmanager alerts on Kubernetes and OpenShift"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "David Turner" }]
keywords = ["kubernetes", "openshift", "alertmanager", "gitops"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
]
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "httpx>=0.28.0",
  "kubernetes>=33.1.0",
  "PyYAML>=6.0",
  "psycopg[binary,pool]>=3.2.0",
]

[project.urls]
Homepage = "https://github.com/davtur/alert-processor"
Issues = "https://github.com/davtur/alert-processor/issues"
Changelog = "https://github.com/davtur/alert-processor/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["app*"]
